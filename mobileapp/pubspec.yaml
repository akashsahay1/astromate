name: astromate
description: "Astromate - astrology consultations"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI Dependencies
  cupertino_icons: ^2.0.0
  # State Management
  provider: ^6.1.5+1

  # Network & API
  dio: ^5.11.1
  http: ^1.6.0
  socket_io_client: ^3.1.6
  connectivity_plus: ^7.3.2
  app_links: ^7.2.2

  # WebRTC for voice/video calls
  flutter_webrtc: ^1.6.3

  # Audio for ringtones
  just_audio: ^0.10.6

  # Native incoming call UI (CallKit for iOS, full-screen for Android)
  flutter_callkit_incoming: ^3.1.6

  # Payment
  razorpay_flutter: ^1.4.7

  # Local Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  # Navigation
  # Dependency Injection
  get_it: ^9.3.0
  # Image & Media
  image_picker: ^1.2.4
  flutter_svg: ^2.3.2

  # Animations
  confetti: ^0.8.0

  # Permissions & Device
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2

  # Firebase - For push notifications and Google Sign-In
  firebase_core: ^4.15.2 # ponytail: held at v4 — firebase-ios-sdk 13 (v5) conflicts with GoogleSignIn 9 (gtm-session-fetcher); bump when google_sign_in_ios moves to GoogleSignIn 10
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.3

  # Google OAuth - For custom implementation via Next.js APIs
  google_sign_in: ^7.2.0

  # Google Places for address autocomplete
  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

  # Phone & OTP
  intl_phone_field: ^3.2.0

  # Date & Time
  # Forms & Validation
  # UI Components
  lottie: ^3.8.2
  http_parser: ^4.1.2

  # Splash Screen Generator
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

  # Testing dependencies
  mockito: ^5.8.1
  build_runner: ^2.16.2
  mocktail: ^1.0.5

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/config/
    - assets/audio/

  fonts:
    - family: Ergonomique
      fonts:
        - asset: assets/fonts/ergonomique-regular.otf

# App Icon Configuration: dart run flutter_launcher_icons
# Source art: Astromate "A" mark (client logo, 2026-10-31) — yellow #FEBC0C on red #DB0007
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#DB0007"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#DB0007"
    theme_color: "#DB0007"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

# Native Splash Screen Configuration: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#DB0007"
  image: "assets/images/splash_logo.png"
  branding: "assets/images/splash_branding.png"

  # Android 12+ splash configuration
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#DB0007"
    icon_background_color: "#DB0007"
    branding: "assets/images/splash_branding.png"

  # Platform configuration
  android: true
  ios: true
  web: false

  # iOS content mode
  ios_content_mode: center

  # Fullscreen mode
  fullscreen: true
